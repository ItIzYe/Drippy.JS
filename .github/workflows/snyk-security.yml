name: Snyk Security

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # für actions/checkout
      security-events: write # für das Hochladen der SARIF-Ergebnisse
      actions: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Snyk Code test
        run: |
          # Ein minimales, gültiges SARIF erstellen, falls der Scan fehlschlägt/leer ist
          echo '{"version": "2.1.0", "$schema": "http://json.schemastore.org/sarif-2.1.0-rtm.5", "runs": [{"tool": {"driver": {"name": "Snyk"}}, "results": []}]}' > snyk-code.sarif
          
          # Direktes Authentifizieren über das Secret-Argument (umgeht env-Fehler)
          snyk auth ${{ secrets.SNYK_TOKEN }}
          
          # Code-Test ausführen
          snyk code test --sarif > snyk-code.sarif || true

      - name: Snyk Open Source monitor
        run: |
          # Authentifizieren für den Monitor-Schritt
          snyk auth ${{ secrets.SNYK_TOKEN }}
          
          snyk monitor --all-projects || true

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
