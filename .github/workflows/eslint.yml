name: ESLint Scanning

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Zwingend erforderlich für den SARIF-Upload

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm install @microsoft/eslint-formatter-sarif --no-save

      - name: Run ESLint
        continue-on-error: true
        run: |
          # Erzwinge das Erstellen einer leeren Datei, falls ESLint komplett streikt
          echo "{}" > eslint-results.sarif
          
          # Führe ESLint aus. --no-error-on-unmatched-pattern verhindert Abstürze, falls Ordner leer sind
          npx eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif \
            --no-error-on-unmatched-pattern

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
