name: ESLint Scanning

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Zwingend erforderlich für den SARIF-Upload

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm install @microsoft/eslint-formatter-sarif --no-save

      - name: Run ESLint
        continue-on-error: true
        run: |
          # 1. Dummy-Datei erstellen, damit der Upload-Schritt niemals fehlschlägt (image_886ff4.png)
          echo '{"version": "2.1.0", "$schema": "http://json.schemastore.org/sarif-2.1.0-rtm.5", "runs": [{"tool": {"driver": {"name": "ESLint"}}, "results": []}]}' > eslint-results.sarif
          
          # 2. ESLint ausführen (überschreibt das Dummy-SARIF, wenn Code-Fehler gefunden werden)
          npx eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif \
            --no-error-on-unmatched-pattern

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4 # Update auf v4 behebt die Warnung aus image_886ff4.png
        with:
          sarif_file: eslint-results.sarif
