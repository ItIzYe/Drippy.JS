name: ESLint Scanning

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Wichtig für den SARIF-Upload

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm install @microsoft/eslint-formatter-sarif --no-save

      - name: Run ESLint
        # continue-on-error sorgt dafür, dass der Upload-Schritt auch bei Code-Fehlern ausgeführt wird
        continue-on-error: true
        run: |
          npx eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif

      - name: Upload SARIF results
        # Nutzt v4, um die Deprecation-Warnung zu fixen
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
